/* 2026-10-25: white writing sheets and aligned history */
:root{--paper:#ffffff;}
.paper{background:#ffffff;}
.thread{margin-left:0;padding-left:0;border-left:0;}
@media(max-width:600px){.thread{margin-left:0;padding-left:0;border-left:0;}}

/* Minimal navigation and chronological monthly archive */
.diary-tabs{display:flex;align-items:center;gap:25px}.diary-tab{border:0;border-bottom:1px solid transparent;background:transparent;color:#829080;padding:8px 2px 9px;font-size:15px;letter-spacing:.6px}.diary-tab.active{color:var(--ink);border-bottom-color:#698363}.diary-tab:hover{color:var(--ink)}header{margin-top:36px;margin-bottom:24px}.month-head{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 22px;color:var(--muted);font-size:13px}.month-group{margin-bottom:34px}.month-title{margin:0 0 14px;padding:0 2px 12px;border-bottom:1px solid #bdc8b7;color:var(--ink);font-size:20px;font-weight:400;letter-spacing:1px}.month-title small{font-size:12px;color:var(--muted);margin-left:12px}.month-group .paper{margin-bottom:12px}.month-group .entry:last-child{border-bottom:1px solid #dce3d4}.month-empty{padding:55px 15px}.diary-tab:focus-visible{outline:2px solid #557353;outline-offset:4px}@media(max-width:600px){header{margin-top:23px}.diary-tabs{gap:16px}.diary-tab{font-size:14px}.month-title{font-size:18px}}

/* Auto-growing diary sheet: one consistent 36px rhythm for text and ruled lines. */
#content{display:block;min-height:180px;height:auto;resize:none;overflow-y:hidden;line-height:36px;padding:0;margin:24px 0 14px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#a4b59b5e 35px,#a4b59b5e 36px);background-size:100% 36px;background-position:left top;}

/* Compact previews on today's page */
#entries .entry p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden;white-space:pre-wrap;line-height:2.1;max-height:calc(2.1em * 4);margin-bottom:8px}
#entries .entry.expanded p{display:block;max-height:none;overflow:visible}
#entries .entry .entry-toggle{display:inline-block;margin:2px 0 12px;padding:5px 0;color:#557353;font-size:13px;text-decoration:underline;text-underline-offset:3px}
#entries .entry .entry-toggle:focus-visible{outline:2px solid #557353}
/* Calendar archive */
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 14px}
.calendar-toolbar h2{font-size:21px;font-weight:400;letter-spacing:1px;margin:0}
.calendar-nav{display:flex;gap:8px}
.calendar-nav button{border:1px solid #c7d1c0;background:#fff;color:#536f50;border-radius:2px;padding:5px 12px;font-size:17px}
.calendar-shell{padding:24px 30px 27px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-weekday{text-align:center;font-size:12px;color:#7c8c79;padding:10px 0}
.calendar-day{background:transparent;border:1px solid transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#34483a;border-radius:3px;font-size:16px}
.calendar-day.has-entry{background:#f1f5ed;border-color:#dbe5d5;cursor:pointer}
.calendar-day.has-entry:hover,.calendar-day.selected{background:#dce9d8;border-color:#7c9974}
.calendar-day:disabled{cursor:default;color:#aab3a7}
.calendar-day .day-count{font-size:10px;color:#64825d;line-height:1}
.calendar-day:focus-visible{outline:2px solid #557353}
.day-heading{font-size:17px;font-weight:400;border-bottom:1px solid #c6d3c1;padding:10px 0 12px;margin:22px 0 16px}
.archive-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}

const localDateParts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});
function dateKey(date){
 const parts=localDateParts.formatToParts(date);
 const v=k=>parts.find(p=>p.type===k).value;
 return `${v('year')}-${v('month')}-${v('day')}`;
}
function dateLabel(item){return new Intl.DateTimeFormat('ko-KR',{timeZone:tz,year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(item.created_at));}
function setView(view){
 currentView=view;
 $('writeView').classList.toggle('hidden',view!=='write');
 $('monthsView').classList.toggle('hidden',view!=='months');
 $('tabWrite').classList.toggle('active',view==='write');
 $('tabMonths').classList.toggle('active',view==='months');
 $('tabWrite').setAttribute('aria-current',view==='write'?'page':'false');
 $('tabMonths').setAttribute('aria-current',view==='months'?'page':'false');

$('prevMonth').onclick=()=>shiftMonth(-1);

function shiftMonth(delta){
 const [y,m]=calendarMonth.split('-').map(Number);
 const d=new Date(Date.UTC(y,m-1+delta,1));
 calendarMonth=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
 selectedDay='';renderCalendar();renderSelectedDay();
}
async function fetchAllEntries(){
 if(!client||!user)throw new Error('먼저 로그인해 줘.');
 const all=[];const size=500;
 for(let start=0;;start+=size){
  const {data,error}=await client.from('diary_entries').select('id,content,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).range(start,start+size-1);
  if(error)throw error;
  all.push(...(data||[]));
  if(!data||data.length<size)break;
 }
 return all;
}

// Render a four-line preview of each entry in today's history. Click to expand/collapse.
function installEntryPreviews(){
 const box=$('entries');
 const observer=new MutationObserver(()=>{
  for(const article of box.querySelectorAll('.entry:not([data-preview-ready])')){
   article.dataset.previewReady='1';
   const paragraph=article.querySelector('p');if(!paragraph)continue;
   const toggle=document.createElement('button');toggle.type='button';toggle.className='link entry-toggle';toggle.textContent='전체 읽기';toggle.setAttribute('aria-expanded','false');
   paragraph.after(toggle);
   toggle.onclick=()=>{const open=article.classList.toggle('expanded');toggle.textContent=open?'접어두기':'전체 읽기';toggle.setAttribute('aria-expanded',String(open));};
   // Hide the toggle if the entry fits into four rendered lines.
   requestAnimationFrame(()=>{if(!article.isConnected)return;const style=getComputedStyle(paragraph);const limit=parseFloat(style.lineHeight)*4+2;article.classList.add('expanded');const fullHeight=paragraph.scrollHeight;article.classList.remove('expanded');toggle.hidden=fullHeight<=limit;});
  }

 observer.observe(box,{childList:true});
}
